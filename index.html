<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <!-- Decorative background -->
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>
  <div class="blob blob--3"></div>

  <main class="calculator">
    <!-- Top bar -->
    <header class="calculator__top">
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
      <span class="calculator__title">Calculator</span>
    </header>

    <!-- Display -->
    <section class="display">
      <div class="display__history" id="history"></div>
      <div class="display__current" id="display">0</div>
    </section>

    <!-- Keypad -->
    <section class="keys">
      <button class="key key--func" data-action="clear">AC</button>
      <button class="key key--func" data-action="delete">⌫</button>
      <button class="key key--func" data-action="percent">%</button>
      <button class="key key--op" data-action="operator" data-value="/">÷</button>

      <button class="key" data-action="number" data-value="7">7</button>
      <button class="key" data-action="number" data-value="8">8</button>
      <button class="key" data-action="number" data-value="9">9</button>
      <button class="key key--op" data-action="operator" data-value="*">×</button>

      <button class="key" data-action="number" data-value="4">4</button>
      <button class="key" data-action="number" data-value="5">5</button>
      <button class="key" data-action="number" data-value="6">6</button>
      <button class="key key--op" data-action="operator" data-value="-">−</button>

      <button class="key" data-action="number" data-value="1">1</button>
      <button class="key" data-action="number" data-value="2">2</button>
      <button class="key" data-action="number" data-value="3">3</button>
      <button class="key key--op" data-action="operator" data-value="+">+</button>

      <button class="key" data-action="sign">±</button>
      <button class="key" data-action="number" data-value="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key--equals" data-action="equals">=</button>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
